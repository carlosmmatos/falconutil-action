name: PR16 retry test
on:
  push:
    branches: [test/pr-16-retry]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run -d -p 5000:5000 registry:2 && docker pull nginx:latest
      - id: cid
        env:
          FALCON_CLIENT_ID: ${{ secrets.FALCON_CLIENT_ID }}
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}
        run: |
          curl -fsSL -o pull.sh https://raw.githubusercontent.com/CrowdStrike/falcon-scripts/main/bash/containers/falcon-container-sensor-pull/falcon-container-sensor-pull.sh
          cid=$(bash pull.sh -r us-2 --get-cid | tail -n 1)
          echo "::add-mask::$cid"
          echo "cid=$cid" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          falcon_client_id: ${{ secrets.FALCON_CLIENT_ID }}
          falcon_region: us-2
          cid: ${{ steps.cid.outputs.cid }}
          source_image_uri: nginx:latest
          target_image_uri: localhost:5000/nginx:patched
        env:
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}
      - run: docker image inspect localhost:5000/nginx:patched --format '{{.Id}}'
