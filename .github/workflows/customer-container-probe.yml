# Test-only probe: the customer's job-level container options on GitHub-hosted ubuntu-latest,
# with the image they most likely use. Kept separate so a container that can't start doesn't
# block the main test.
name: customer-container-probe

on:
  push:
    branches: [test/customer-workflow]

jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
      options: --cpus 8 --memory 8g
    steps:
      - run: |
          echo "uname -m: $(uname -m)"
          echo "nproc: $(nproc)"
          docker info --format 'Docker architecture: {{.Architecture}} CPUs: {{.NCPU}}'
